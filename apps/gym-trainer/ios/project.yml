# Projeto Xcode gerado com XcodeGen: `brew install xcodegen && xcodegen generate`
name: GymTrainer
options:
  bundleIdPrefix: com.example.gymtrainer
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""  # preencha com o seu Team ID da Apple

targets:
  GymTrainer:
    type: application
    platform: iOS
    sources: [GymTrainer, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.gymtrainer.GymTrainer
    dependencies:
      - target: GymTrainerWatch
    entitlements:
      path: GymTrainer/GymTrainer.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: GymTrainer/Info.plist
      properties:
        CFBundleDisplayName: GymTrainer
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "O GymTrainer lê frequência cardíaca, calorias, passos, VO2máx, composição corporal e treinos do app Saúde e do Apple Watch para calcular seu gasto calórico e ajustar sua ficha."
        NSHealthUpdateUsageDescription: "O GymTrainer grava seus treinos e os resultados das avaliações físicas (peso, % de gordura, massa magra, cintura) no app Saúde."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]

  GymTrainerWatch:
    type: application
    platform: watchOS
    sources: [GymTrainerWatch, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.gymtrainer.GymTrainer.watchkitapp
    entitlements:
      path: GymTrainerWatch/GymTrainerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: GymTrainerWatch/Info.plist
      properties:
        CFBundleDisplayName: GymTrainer
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.gymtrainer.GymTrainer
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "O GymTrainer lê sua frequência cardíaca e calorias durante o treino."
        NSHealthUpdateUsageDescription: "O GymTrainer grava seus treinos no app Saúde."
