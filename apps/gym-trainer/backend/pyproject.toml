[project]
name = "gym-trainer-api"
version = "1.0.0"
description = "API do GymTrainer: personal trainer virtual com avaliações bimestrais, fichas e integração com Apple Health/Apple Watch"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
