<style>
/* Layout: coluna de app (máx. 560px) com barra de abas fixa embaixo; cores de anilha olímpica marcam as zonas de FC. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fa; --ink: #16202b; --muted: #5b6878; --line: #d5dbe3;
  --accent: #c8332b; --accent-ink: #ffffff; --accent-soft: #f8e3e1;
  --plate-blue: #1f5fbf; --plate-yellow: #d9a400; --plate-green: #2e8b4e; --plate-red: #c8332b; --plate-grey: #7d8896;
  --ok: #2e8b4e; --warn: #b7791f; --bad: #c8332b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --surface: #18212b; --surface-2: #1e2934; --ink: #e8edf2; --muted: #93a1b1; --line: #2a3644;
  --accent: #e5534a; --accent-ink: #ffffff; --accent-soft: #3a1f1e;
  --plate-blue: #4b8ae6; --plate-yellow: #e8bb2e; --plate-green: #4cb071; --plate-red: #e5534a; --plate-grey: #8d99a8;
  --ok: #4cb071; --warn: #e0a64a; --bad: #e5534a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212b; --surface-2: #1e2934; --ink: #e8edf2; --muted: #93a1b1; --line: #2a3644;
  --accent: #e5534a; --accent-ink: #ffffff; --accent-soft: #3a1f1e;
  --plate-blue: #4b8ae6; --plate-yellow: #e8bb2e; --plate-green: #4cb071; --plate-red: #e5534a; --plate-grey: #8d99a8;
  --ok: #4cb071; --warn: #e0a64a; --bad: #e5534a; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand span { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 19px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
section.block { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .tiny { color: var(--muted); }
.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li span:last-child { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
button, .btn { font: inherit; font-weight: 700; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--plate-blue); outline-offset: 2px; }
.full { width: 100%; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--warn); font-size: 14.5px; }
.alert.bad { border-left-color: var(--bad); }

/* Abas */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; flex-direction: column; gap: 2px; padding: 8px 2px 10px; font-size: 12px; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Ficha */
.daytabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.daytabs button { white-space: nowrap; padding: 8px 12px; font-size: 14px; }
.daytabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.exitem { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; text-align: left; font-weight: 400; width: 100%; }
.exitem:last-child { border-bottom: 0; }
.exnum { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--accent); text-align: center; }
.exname { font-weight: 700; }
.chev { color: var(--muted); font-size: 20px; }
.zone { display: flex; height: 10px; border-radius: 99px; overflow: hidden; }
.zone i { flex: 1; }
.z1 { background: var(--plate-grey); } .z2 { background: var(--plate-green); } .z3 { background: var(--plate-yellow); } .z4 { background: var(--plate-blue); } .z5 { background: var(--plate-red); }
.zrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; }
.zdot { width: 12px; height: 12px; border-radius: 50%; }

/* Demonstração */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.sheet .app { padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; font-weight: 400; width: 100%; }
.step b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--display); font-size: 18px; }
.step[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); }
.step[aria-current="step"] b { background: var(--accent); color: var(--accent-ink); }
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; }
.tempo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tempo div { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--surface-2); transition: background .15s; }
.tempo div b { display: block; font-family: var(--display); font-size: 22px; }
.tempo div.on { background: var(--accent); color: var(--accent-ink); }
.cues li { margin-bottom: 4px; }
ul { margin: 0; padding-left: 20px; }

/* Formulários */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13.5px; font-weight: 600; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.check input { width: 20px; height: 20px; margin-top: 2px; }
details summary { cursor: pointer; font-weight: 700; }

/* Treino ao vivo */
.big { font-family: var(--display); font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-ring { display: grid; place-items: center; padding: 10px; border-radius: var(--radius); background: var(--surface-2); }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
.stepper b { text-align: center; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stepper button { padding: 8px 0; font-size: 20px; }

/* Coach */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 12px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font-size: 13.5px; font-weight: 600; padding: 7px 10px; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">

function evaluate(p, a, prev) {

      let pr = main ? base : { sets: 3, reps: "10-15", rest: 60, rir: base.rir };
      if (e.t === "isometria") pr = { sets: 3, reps: "30-45 s", rest: 45, rir: "-" };
      items.push({ id, sets: pr.sets, reps: pr.reps, rest: pr.rest, rir: pr.rir, tempo: e.t });
    });
    let cardioMin = cmin;
    while (strengthTime(items) + cardioMin + 10 > p.minutes && items.length > 4) items.pop();
    const st = strengthTime(items);
    const fit = Math.max(10, Math.round(p.minutes - st - 10));
    const shortened = fit < cardioMin; if (shortened) cardioMin = fit;
    const metS = MET[["hypertrophy", "strength"].includes(p.goal) ? "strength_moderate" : "strength_light"];
    const cardio = { id: cid, min: cardioMin, zone, kcal: kcalMET(MET[EX[cid].met], w, cardioMin), shortened, hiit: hiit ? { zone: z[3], kcal: kcalMET(MET.hiit, w, 21) } : null };
    return { label, items, cardio, minutes: Math.round(st + cardioMin + 10), kcal: Math.round(kcalMET(metS, w, st) + cardio.kcal) };
  });
  return { base, days, weeklyCardio: days.reduce((s, d) => s + d.cardio.min, 0), nutrition: R.nutrition, alerts: R.alerts, validUntil: R.next };
}

let curStep = 0;
function setStep(i) {
  curStep = i;
  const steps = document.querySelectorAll(".step");
  steps.forEach(b => +b.dataset.step === i ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  const bar = document.getElementById("demoBar"); if (bar) bar.style.width = ((i + 1) / steps.length * 100) + "%";
}
function toggleDemo(n) {
  const b = document.getElementById("playBtn");
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; b.textContent = "▶ Reproduzir"; return; }
  b.textContent = "❚❚ Pausar"; setStep(curStep = 0);
  demoTimer = setInterval(() => setStep(curStep = (curStep + 1) % n), 3500);
}
function toggleTempo(tp) {
  const b = document.getElementById("tempoBtn");
  if (tempoTimer) { clearTimeout(tempoTimer); tempoTimer = null; b.textContent = "Metrônomo"; document.querySelectorAll("#tempo div").forEach(d => d.classList.remove("on")); return; }
  b.textContent = "Parar"; let ph = 0;
  const tick = () => {
    document.querySelectorAll("#tempo div").forEach(d => d.classList.toggle("on", +d.dataset.ph === ph));
    const dur = Math.max(tp[ph], 0.25); ph = (ph + 1) % 4;
    tempoTimer = setTimeout(tick, dur * 1000);
  };
  tick();
}

}
function bindWorkout() { clearInterval(tickTimer); if (W) { updateTick(); tickTimer = setInterval(updateTick, 1000); } }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function updateTick() {

  const el = document.getElementById("elapsed"); if (el) el.textContent = mmss((Date.now() - W.start) / 1000);
  const rb = document.getElementById("restBox"), r = document.getElementById("rest");
  if (rb && r) { const left = (W.restUntil - Date.now()) / 1000; rb.hidden = left <= 0; r.textContent = mmss(left); }
  const cc = document.getElementById("cardioClock");
  if (cc && W.cardioStart) { const c = plan().days[W.di].cardio; const left = c.min * 60 - (Date.now() - W.cardioStart) / 1000; cc.textContent = left > 0 ? mmss(left) : "Concluído"; }
}
function logSet() {

}
function nextEx() {

}
function finishWorkout() {
  const p = S.profile, w = latest().weight, min = (Date.now() - W.start) / 60000, hr = parseFloat(W.hr);
  const onlyCardio = W.logs.length === 0 && W.cardioStart;
  const met = onlyCardio ? MET[EX[plan().days[W.di].cardio.id].met] : MET.strength_moderate;
  const kcal = hr > 40 ? kcalHR(hr, w, ageOf(p.birth), p.sex, min) : kcalMET(met, w, min);
  const rec = { start: new Date(W.start).toISOString(), min: r1(min), day: W.label, kcal: Math.round(kcal), source: hr > 40 ? "FC (Keytel 2005)" : "MET (Compendium 2024)", sets: W.logs.length, volume: W.logs.reduce((s, l) => s + l.reps * l.kg, 0), avgHr: hr > 40 ? hr : null };
  S.workouts.push(rec); W = null; save();

}

function coachContext() {

let sampleFn = null, coachBusy = false;

function bindCoach() {

async function ask(text) {
  text = (text || "").trim(); if (!text || coachBusy) return;
  if (!sampleFn) { try { sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; } }
  S.chat.push({ role: "user", content: text });
  render();
  const chat = document.getElementById("chat");
  const out = document.createElement("div"); out.className = "msg assistant"; out.textContent = "Pensando…"; chat.appendChild(out); out.scrollIntoView({ block: "end" });
  const fail = msg => { S.chat.push({ role: "assistant", content: msg }); coachBusy = false; render(); };
  if (!sampleFn) { fail("O Coach com IA não está disponível nesta visualização. Abra o app pelo claude.ai com sua conta para conversar com ele."); return; }

  const history = S.chat.filter(m => !m.error).slice(-12).map(m => ({ role: m.role, content: m.content }));
  while (history.length && history[0].role !== "user") history.shift();
  history[0] = { role: "user", content: `${COACH_PROMPT}\n\nDados atuais do aluno (JSON):\n${coachContext()}\n\n---\nMensagem do aluno: ${history[0].content}` };
  try {
    const res = await sampleFn(history, { cache: false, onText: u => { out.textContent = u.text || "Pensando…"; } });
    S.chat.push({ role: "assistant", content: res.text }); save();
    coachBusy = false; render();
  } catch (e) {
    S.chat.push({ role: "assistant", error: true, content: e && e.code === "not_granted" ? "Para conversar com o Coach, permita o acesso ao Claude quando o aviso aparecer." : e && e.code === "rate_limited" ? "Muitas mensagens seguidas. Espere um minuto e tente de novo." : "Não consegui responder agora. Tente de novo em instantes." });
    coachBusy = false; render();
  }
}

/* ------------------------------------------------------------------ Início */
render();
initStore();
</script>
